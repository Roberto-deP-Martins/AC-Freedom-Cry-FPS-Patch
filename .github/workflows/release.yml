name: Publish new version

on:
  push:
    tags:
      - 'v*.*.*'

jobs:
  build:
    strategy:
      matrix:
        include:
          - platform: windows-latest
            os-name: windows
            ext: .exe
          - platform: ubuntu-latest
            os-name: linux
            ext: ''
          - platform: macos-latest
            os-name: macos
            ext: ''

    runs-on: ${{ matrix.platform }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Setup Swift Environment
        uses: SwiftyLab/setup-swift@latest

      - name: Build Release Binary
        run: swift build -c release --product "AC_Freedom_Cry_240FPS_Patch"

      - name: Prepare Binary
        shell: bash
        run: |
          BINARY_NAME="AC_Freedom_Cry_240FPS_Patch"
          mkdir -p dist
          cp ".build/release/$BINARY_NAME${{ matrix.ext }}" "dist/$BINARY_NAME-${{ matrix.platform }}${{ matrix.ext }}"

      - name: Upload Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: binary-${{ matrix.os-name }}
          path: dist/*

  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: all-artifacts

      - name: Flatten and Prepare Release Folder
        run: |
          mkdir -p dist
          # Find all files inside all-artifacts and copy them flatly into dist/
          find all-artifacts -type f -exec cp {} dist/ \;
          ls -la dist/

      - name: Create Release and Upload All Assets
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          draft: true