name: Publish new version

on:
  push:
    tags:
      - 'v*.*.*'

jobs:
    release:
        strategy:
            matrix:
                platform: [ubuntu-latest, windows-latest, macos-latest]
        runs-on: ${{ matrix.platform }}
        steps:
            - name: Checkout repository
              uses: actions/checkout@v3

            - name: Build on Windows
              if: matrix.platform == 'windows-latest'
              run: |
                  echo "Building on Windows"
                  winget install --id Microsoft.VisualStudio.2022.Community --exact --force --override "--quiet --wait --add Microsoft.VisualStudio.Component.Windows11SDK.22621 --add Microsoft.VisualStudio.Component.VC.Tools.x86.x64 --add Microsoft.VisualStudio.Component.VC.Tools.ARM64"
                  winget install --id Swift.Toolchain -e --source winget
                  swift build -c release

            - name: Build on Unix (Ubuntu / macOS)
              if: matrix.platform != 'windows-latest'
              run: |
                  echo "Building on ${{ matrix.platform }}"
                  swift build -c release
            - name: Prepare Binary
              shell: bash
              run: |
                  BINARY_NAME="acfc-240-fps-patch"
                  
                  if [ "${{ matrix.platform }}" = "windows-latest" ]; then
                      EXT=".exe"
                  else
                      EXT=""
                  fi
                  
                  mkdir -p dist
                  cp .build/release/$BINARY_NAME$EXT dist/$BINARY_NAME-${{ matrix.platform }}$EXT

            - name: Upload Release Asset
              uses: softprops/action-gh-release@v2
              if: startsWith(github.ref, 'refs/tags/')
              with:
                files: dist/*
                draft: true